<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Simab Workspace</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- the rail (left, beside the projects): the tools in a narrow strip -->
  <nav id="rail" class="rail">
    <button id="sb-remote" class="rail-ws hidden" title="Workspace — click to switch"></button>
    <button class="rbtn" id="btn-terminal" title="Terminal on the server, in your home folder (no project needed)"><i>›_</i><span>Terminal</span></button>
    <button class="rbtn" id="btn-claude" title="New chat without a project: Claude (on the server) or another AI on your computer"><i>✳</i><span>Chat</span></button>
    <button class="rbtn" id="btn-files" title="Files on the server, in your home folder (no project needed)"><i>▤</i><span>Files</span></button>
    <button class="rbtn" id="btn-tasks" title="Your tasks — kept on the server, the same on every device"><i>✓</i><span>Tasks</span><b class="rcount"></b></button>
    <button class="rbtn" id="btn-palette" title="Search projects, tabs and commands (Ctrl+Shift+P)"><i>⌕</i><span>Search</span></button>
    <button class="rbtn" id="btn-history" title="History — what you did"><i>⟲</i><span>History</span></button>
    <button class="rbtn" id="btn-usage" title="Claude usage — limits and cost"><i>◔</i><span>Usage</span></button>
    <span class="rail-fill"></span>
    <button class="rbtn" id="btn-settings" title="Settings, updates, layout, quit"><i>☰</i><span>Menu</span></button>
  </nav>
  <aside id="sidebar">
    <header class="side-head">
      <span class="brand">simab</span>
      <span class="pc-net hidden" id="pc-net" title="Connection of this computer to the server"></span>
      <span class="lan-ip hidden" id="lan-ip"></span>
      <span class="status">
        <i class="dot" id="st-ssh" title="Server"></i>
        <i class="dot" id="st-sync" title="Sync"></i>
      </span>
      <button class="icon-btn" id="btn-hide-side" title="Hide sidebar (Alt+M)">‹</button>
    </header>
    <input id="proj-filter" type="search" data-voice-to-text="off" placeholder="Filter projects" autocomplete="off" spellcheck="false">
    <div id="projects"></div>
    <button id="server-stats" class="usage sstats hidden"></button>
    <button id="usage" class="usage hidden"></button>
    <button id="side-files-btn" class="usage side-files-btn hidden" title="Open the files of this project"></button>
    <button id="update-note" class="update-note hidden" title="Install the new version"></button>
  </aside>
  <div id="resizer"></div>
  <main id="workspace">
    <div id="layout"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-inner">
        <p class="empty-title">No tabs open</p>
        <p class="muted" id="empty-hint">Pick a project on the left, or press <kbd>Ctrl+Shift+P</kbd>.</p>
        <div id="empty-actions" class="empty-actions"></div>
        <div id="restore-box" class="hidden"></div>
      </div>
    </div>
  </main>
</div>
<button id="show-side" title="Show sidebar (Alt+M)">›</button>
<div id="modal-root"></div>
<div id="menu-root"></div>
<div id="toasts"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="vendor/addon-search.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="voice.js"></script>
<script src="sounds.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script src="files.js"></script>
<script src="tasks.js"></script>
<script src="computers.js"></script>
<script src="agents.js"></script>
<script src="prompts.js"></script>
</body>
</html>
